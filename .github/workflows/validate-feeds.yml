name: Validate feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate RSS feeds
        run: node scripts/validate-feeds.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-report
          path: reports/feed-report.json
